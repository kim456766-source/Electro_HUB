<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN Money Payment - MyEcom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .payment-container {
            max-width: 500px;
            margin: 50px auto;
        }
        .payment-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .payment-header {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .payment-header i {
            font-size: 60px;
            margin-bottom: 15px;
        }
        .payment-header h3 {
            font-weight: 700;
            margin-bottom: 5px;
        }
        .payment-body {
            padding: 40px;
            background: white;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .input-group {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .input-group:focus-within {
            border-color: #ffc107;
            box-shadow: 0 0 0 0.2rem rgba(255, 193, 7, 0.25);
        }
        .input-group-text {
            background: #f8f9fa;
            border: none;
            color: #ffc107;
            font-size: 1.2rem;
            padding: 12px 15px;
        }
        .form-control {
            border: none;
            padding: 12px 15px;
            font-size: 1rem;
        }
        .form-control:focus {
            box-shadow: none;
        }
        .amount-display {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        .amount-label {
            color: #666;
            margin-bottom: 5px;
        }
        .amount-value {
            font-size: 2rem;
            font-weight: 700;
            color: #ffc107;
        }
        .btn-pay {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 193, 7, 0.4);
        }
        .secure-badge {
            text-align: center;
            margin-top: 20px;
            color: #28a745;
        }
        .secure-badge i {
            margin-right: 5px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #666;
            text-decoration: none;
        }
        .back-link a:hover {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="container payment-container">
        <div class="payment-card">
            <div class="payment-header">
                <i class="fas fa-mobile-alt"></i>
                <h3>MTN Mobile Money</h3>
                <p class="mb-0">Pay securely with your mobile money</p>
            </div>
            
            <div class="payment-body">
                <!-- Amount Display -->
                <div class="amount-display">
                    <div class="amount-label">Total Amount</div>
                    <div class="amount-value">${{ total|floatformat:2 }}</div>
                </div>
                
                <form method="post" action="{% url 'orders:process_payment' %}">
                    {% csrf_token %}
                    
                    <!-- Phone Number -->
                    <div class="form-group">
                        <label class="form-label">MTN Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-phone-alt"></i>
                            </span>
                            <input type="tel" 
                                   class="form-control" 
                                   name="phone_number" 
                                   placeholder="07XXXXXXXX"
                                   pattern="[0-9]{10}"
                                   required>
                        </div>
                        <small class="text-muted">Enter the MTN number registered for mobile money</small>
                    </div>
                    
                    <!-- Full Name -->
                    <div class="form-group">
                        <label class="form-label">Account Holder Name</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" 
                                   class="form-control" 
                                   name="account_name" 
                                   placeholder="Enter your full name"
                                   required>
                        </div>
                    </div>
                    
                    <!-- PIN (optional - in production you wouldn't collect this) -->
                    <div class="form-group">
                        <label class="form-label">Mobile Money PIN</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" 
                                   class="form-control" 
                                   name="pin" 
                                   placeholder="Enter your PIN"
                                   pattern="[0-9]{4}"
                                   maxlength="4"
                                   required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePinVisibility()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <small class="text-muted">Enter your 4-digit mobile money PIN</small>
                    </div>
                    
                    <!-- Hidden Fields -->
                    <input type="hidden" name="payment_method" value="mtn_money">
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn-pay" id="payButton">
                        <i class="fas fa-lock me-2"></i>Pay ${{ total|floatformat:2 }}
                    </button>
                </form>
                
                <div class="secure-badge">
                    <i class="fas fa-shield-alt"></i>
                    Secured by MTN Mobile Money
                </div>
                
                <div class="back-link">
                    <a href="{% url 'orders:payment_method' %}">
                        <i class="fas fa-arrow-left me-2"></i>Back to Payment Methods
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePinVisibility() {
            const pinInput = document.querySelector('input[name="pin"]');
            const button = event.currentTarget;
            const icon = button.querySelector('i');
            
            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pinInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        // Format phone number as user types
        document.querySelector('input[name="phone_number"]').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
        });
        
        // Loading state on submit
        document.querySelector('form').addEventListener('submit', function(e) {
            const button = document.getElementById('payButton');
            button.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processing...';
            button.disabled = true;
        });
    </script>
</body>
</html>
